# New prefix key to ctrl + s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Enable mouse support for pane selection, resizing, and scrolling.
set -g mouse on

# Number windows and panes starting at 1.
set -g base-index 1
setw -g pane-base-index 1

# Split panes in the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes by 5 cells; -r allows repeated presses.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this configuration with prefix + r.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Gruvbox Dark: local theme with session, directory, clock, and hostname.
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-right-status-x '#{=24:#{b:pane_current_path}}'
run-shell "~/.config/tmux/plugins/tmux-gruvbox/gruvbox-tpm.tmux"
set -g status-position bottom
set -g status-interval 5

# Highlight the session label while the prefix key is active.
set -g status-left '#[bg=#{?client_prefix,#fabd2f,#665c54},fg=#{?client_prefix,#282828,#bdae93}] #S #[bg=#3c3836,fg=#{?client_prefix,#fabd2f,#665c54},nobold,noitalics,nounderscore]'
